thresholds:
  valid_match: 0.5
  weak_match: 0.35
destine_relevance:
  min_score: 0.3
  context_window: 2
  sentences:
  - Destination Earth provides digital twin capabilities for climate, weather and environmental decision support
  - DestinE is being integrated into operational public-sector and downstream applications
  - National initiatives connect domestic data, models and institutions to Destination Earth
  - Targeted user partnerships co-design sustainable services using DestinE capabilities
  - Copernicus and Earth Observation data provide important inputs to DestinE applications
  - EuroHPC and artificial intelligence enable high-resolution Earth system simulation
  - Horizon Europe digital twin projects contribute technology and thematic capabilities to the DestinE ecosystem
  - Digital Europe supports deployment and scaling of data, AI and digital services
  - European data spaces and interoperability frameworks enable cross-sectoral DestinE applications
  - Public procurement and demonstrators create adoption pathways for Destination Earth services
  - Cities and regions can combine local digital twins with DestinE climate and environmental information
  - Startups and SMEs can build commercial downstream services on Destination Earth infrastructure
  - Dutch climate adaptation, water, space and digital policies create potential demand for DestinE
  - Destination Earth can support flood risk, drought, heat, biodiversity, ocean and urban planning applications
  - Operational adoption requires skills in Earth observation, geospatial analysis, AI, HPC and digital twins
lifecycle:
  stages:
  - label: Signal
    description: Early mention or weak indication of a DestinE-relevant need or capability.
    keywords:
    - emerging
    - early signs
    - potential
    - could support
    - opportunity
  - label: Recognition
    description: DestinE relevance or a related policy need is explicitly recognised.
    keywords:
    - recognises
    - acknowledges
    - highlights
    - identifies
    - priority
  - label: Strategic Response
    description: A strategy, roadmap, policy response, or implementation framework is proposed.
    keywords:
    - strategy
    - roadmap
    - policy response
    - action plan
    - framework
    - programme
  - label: Investment
    description: Funding, procurement, or resources are committed.
    keywords:
    - fund
    - investment
    - budget
    - grant
    - procurement
    - tender
    - contract
  - label: Pilot / Demonstration
    description: A demonstrator, proof of concept, pilot, or use case is being tested.
    keywords:
    - pilot
    - demonstrator
    - proof of concept
    - proof of value
    - use case
    - trial
  - label: Implementation
    description: Capabilities or services are actively deployed or implemented.
    keywords:
    - implementing
    - deployed
    - launched
    - established
    - in operation
    - rolled out
  - label: Operational Adoption
    description: The capability is embedded in recurring operational decision-making or service delivery.
    keywords:
    - operational
    - routine use
    - embedded in
    - fully integrated
    - service delivery
    - mainstream
search:
  use_sbert: false
  use_cross_encoder: false
  use_openai: true
  sbert_model: paraphrase-multilingual-MiniLM-L12-v2
  cross_encoder_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k_sentences: 5
  chunk_size: 400
  chunk_overlap: 80
  context_window: 2
