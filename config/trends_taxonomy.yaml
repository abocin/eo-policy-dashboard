lifecycle:
  stages:
  - label: Signal
    description: Early mention or weak signal — trend is noted but not analysed
    keywords:
    - emerging
    - early signs
    - beginning to
    - nascent
    - first indications
    - initial signs
  - label: Recognition
    description: Trend is explicitly recognised as significant by the document
    keywords:
    - recognises
    - acknowledges
    - notes that
    - highlights
    - identifies as important
    - significant trend
  - label: Analysis
    description: Trend is analysed with data, evidence, or structured argument
    keywords:
    - data shows
    - analysis indicates
    - evidence suggests
    - according to
    - research shows
    - study found
  - label: Strategic Response
    description: A strategic or policy response to the trend is proposed or underway
    keywords:
    - strategy to
    - policy response
    - strategic plan
    - framework to address
    - initiative to respond
    - programme to tackle
  - label: Investment
    description: Concrete investment or resource allocation in response to the trend
    keywords:
    - invest
    - fund
    - budget allocated
    - resources committed
    - financial support
    - grant
  - label: Implementation
    description: Active implementation of measures responding to the trend
    keywords:
    - implementing
    - rolling out
    - deployed
    - in operation
    - launched
    - established
  - label: Monitoring
    description: Trend is being tracked and measured over time
    keywords:
    - monitor
    - track
    - measure progress
    - indicators
    - KPI
    - benchmark
  - label: Mainstreaming
    description: Response to the trend has become standard practice or policy
    keywords:
    - standard practice
    - mainstream
    - widely adopted
    - fully integrated
    - embedded in
    - routine
