- label: Market — Integration of Space into Mainstream Sectors
  description: 'Evidence that satellite-derived data and services are being embedded into non-space sectors (agriculture,
    insurance, finance, energy, transport, climate, urban planning) as standard operational tools.

    '
  driver: Improved data quality, lower costs, and increased awareness among end users
  trend: Mainstreaming of EO and GNSS data into cross-sectoral decision-making
