- label: Technology — Cloud-Native Geospatial Processing
  description: 'Evidence of a shift from local desktop processing to cloud-native, scalable geospatial data processing — including
    cloud data cubes, serverless architectures, and platforms like Google Earth Engine, Copernicus DIAS.

    '
  driver: Growth in satellite data volumes exceeding local processing capacity
  trend: Migration of EO processing from desktop to cloud-native scalable platforms
