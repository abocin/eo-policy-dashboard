- label: Market — Commercialisation of Space Services
  description: 'Evidence that space services are shifting from publicly funded to commercially driven, with growing private
    sector participation, new entrants, and market competition across the downstream value chain.

    '
  driver: Falling launch costs, miniaturisation, and surplus satellite capacity
  trend: Commercialisation and privatisation of downstream space services
  sector_impact: New business models; competition with public agencies; price pressure
  occupation_impact: Demand for commercial analysts, product managers, sales engineers
  skills_implications: Business development, product management, market analysis, commercial law
